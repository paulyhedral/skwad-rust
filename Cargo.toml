[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/Kochava-Studios/skwad"
rust-version = "1.98"

[workspace.dependencies]
thiserror = "2.0.20"
tempfile = "3.27"
insta = "1.43"
notify = "8.2"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
