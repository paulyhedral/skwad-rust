[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/paulyhedral/skwad-rust"
rust-version = "1.98"

[workspace.dependencies]
thiserror = "2.0.20"
tempfile = "3.27"
insta = "1.43"
notify = "8.2"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
directories = "6.0.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
